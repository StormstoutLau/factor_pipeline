[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-pipeline"
version = "2.5.0"
description = "因子处理统一流水线 (Factor Processing Pipeline) — 5 个处理模块内化 (Fingerprint/Decoupler/AdaptiveWinsor/Imputer/Neutralizer) + 指纹分类 + 回测引擎"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Scott Peng Liu", email = "peng.liu.john@gmail.com" }]
keywords = ["quantitative-finance", "factor-investing", "factor-pipeline", "backtest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# P2 依赖锁定: 核心依赖必装, 可选依赖通过 extras 标注
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "scipy>=1.7.0",
    "networkx>=2.8.0",
    "pydantic>=2.0.0",
    "duckdb>=0.10.0",
    "statsmodels>=0.13.0",
    # v2.4.0 (ADR-019): AdaptiveWinsor 内化所需 (I2 阶段)
    "scikit-learn>=1.0.0",
    # v2.4.0 (ADR-019): Fingerprint/Decoupler/AdaptiveWinsor/Imputer/Neutralizer 已内化到 factor_pipeline/modules/
    # 剩余外部模块: factor-db (数据边界, 不内化)
    "factor-db",
]

[project.optional-dependencies]
# 可选: 语义理解模块 (jieba 中文分词)
semantic = ["jieba>=0.42.0"]
# 可选: 回测引擎 (DataLoaderV3, 需外部安装 Factor_Trading_v3.0)
backtest = ["factor-trading-v3"]
# 可选: GARCH 白化
garch = ["arch>=5.0.0"]
# 可选: 优化器超参搜索
optimizer = ["optuna>=3.0.0"]
# 可选: 测试
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# 全量安装
all = ["arch>=5.0.0", "optuna>=3.0.0", "pytest>=7.0.0", "jieba>=0.42.0"]

[project.urls]
Homepage = "https://github.com/StormstoutLau/factor_pipeline"
Repository = "https://github.com/StormstoutLau/factor_pipeline"

# =============================================================================
# flat-layout: 项目根目录 = 包根目录, 需要 where=[".."] 让 find_packages
# 从父目录 (F:/Coding) 发现 factor_pipeline 包
# include=["factor_pipeline*"] 过滤掉 tests/scripts/docs 等非安装目录
# =============================================================================
[tool.setuptools.packages.find]
where = [".."]
include = ["factor_pipeline*"]
exclude = ["tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:jieba.*",
]
