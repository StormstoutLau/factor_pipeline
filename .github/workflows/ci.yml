# -*- coding: utf-8 -*-
# CI 矩阵 — factor_pipeline 跨版本测试 (ADR-017)
#
# 矩阵: Python 3.10 / 3.11 / 3.12 × ubuntu-latest
# (Windows 暂不纳入 CI 矩阵 — multiprocessing spawn 开销使 test_parallel flaky, ADR-016)
#
# 依赖结构 (v2.4.0 ADR-019 内化后):
#   factor_pipeline 内化了 5 个处理模块到 factor_pipeline/modules/:
#     - factor_fingerprint (原 Factor_Fingerprint)
#     - factor_decoupler (原 Factor_Decoupler)
#     - factor_adaptive_winsor (原 Factor_AdaptiveWinsor)
#     - factor_imputer (原 Factor_Imputer_v2.0)
#     - factor_neutralizer (原 Factor_Neutralizer_v2.0)
#   剩余外部模块 (数据边界, 不内化):
#     - Factor_DB           (factor-db)
#     - Factor_Trading_v3.0 (factor-trading-v3)  — 目录名含版本, 仓库名不含
#
# 安装顺序: 先外部模块 (Factor_DB/Factor_Trading_v3.0), 后主项目 (pip install -e .[all])

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个版本失败不影响其他版本继续跑
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    steps:
      - name: Checkout factor_pipeline
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout external modules (monorepo simulation)
        env:
          # v2.4.0 (ADR-019): 仅保留数据边界模块, 5 个处理模块已内化
          EXT_MODULES: |
            Factor_DB
            Factor_Trading
        run: |
          set -e
          workspace_parent="$(dirname $GITHUB_WORKSPACE)"
          cd "$workspace_parent"
          # 克隆外部数据边界模块
          for repo in Factor_DB Factor_Trading; do
            echo "Cloning $repo..."
            git clone "https://github.com/StormstoutLau/${repo}.git" "${repo}" || {
              echo "WARNING: Failed to clone ${repo}, tests requiring it will fail"
            }
          done
          # Factor_Trading → Factor_Trading_v3.0 (目录名匹配 pyproject.toml)
          if [ -d "Factor_Trading" ] && [ ! -d "Factor_Trading_v3.0" ]; then
            mv Factor_Trading Factor_Trading_v3.0
          fi
          ls -la

      - name: Install external modules (pip install -e .)
        run: |
          set -e
          workspace_parent="$(dirname $GITHUB_WORKSPACE)"
          cd "$workspace_parent"
          # v2.4.0: 仅安装数据边界模块, 处理模块已内化到 factor_pipeline/modules/
          for mod in Factor_DB Factor_Trading_v3.0; do
            if [ -d "$mod" ] && [ -f "$mod/pyproject.toml" ]; then
              echo "Installing $mod..."
              pip install -e "$mod" || {
                echo "WARNING: Failed to install $mod"
              }
            else
              echo "WARNING: $mod not found or missing pyproject.toml"
            fi
          done

      - name: Install factor_pipeline
        run: |
          pip install -e ".[all]" || pip install -e ".[dev]"

      - name: Show installed packages
        run: |
          pip list | grep -iE "factor|arch|optuna|pytest"

      - name: Run tests
        run: |
          # 从父目录运行 pytest 避免 types.py 遮蔽 stdlib (ADR-016 技术债)
          cd "$(dirname $GITHUB_WORKSPACE)"
          python -m pytest factor_pipeline/tests/ -v --tb=short --no-header

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            factor_pipeline/.pytest_cache/
            factor_pipeline/**/test-results.xml
          retention-days: 7

  # 覆盖率汇总 job (可选, 仅在所有矩阵跑完后运行)
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-py*
          merge-multiple: true
      - name: Generate coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "All matrix jobs completed. See artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
