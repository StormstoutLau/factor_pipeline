name: Translate README to English

on:
  push:
    branches: [main, master]
    paths:
      - 'README.md'
      - 'scripts/translate_readme.py'
      - '.github/workflows/translate.yml'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # 跳过 bot 自己提交的 push, 避免无限循环
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Translate README.md to README.en.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/translate_readme.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.en.md
          # 仅当有变更时才提交
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-translate README to English [skip ci]"
            git push
          fi
