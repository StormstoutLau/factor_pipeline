<svg width="220" height="48" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48">
  <defs>
    <!-- 黄铜金属渐变 -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C875"/>
      <stop offset="35%" stop-color="#C9A961"/>
      <stop offset="65%" stop-color="#B5985A"/>
      <stop offset="100%" stop-color="#8B6F3D"/>
    </linearGradient>
    <!-- 暗黄铜 (齿轮主体) -->
    <linearGradient id="brassDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B6F3D"/>
      <stop offset="100%" stop-color="#5D4A2A"/>
    </linearGradient>
    <!-- 蒸汽纹理 (顶部高光) -->
    <linearGradient id="steam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5E6C8" stop-opacity="0"/>
    </linearGradient>
    <!-- 管道纹理 (横向条纹) -->
    <pattern id="pipeTexture" x="0" y="0" width="4" height="48" patternUnits="userSpaceOnUse">
      <rect width="2" height="48" fill="#8B6F3D" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 主背景: 黄铜金属 -->
  <rect width="220" height="48" fill="url(#brass)" stroke="#3D2817" stroke-width="2" rx="4"/>

  <!-- 管道纹理覆盖 -->
  <rect width="220" height="48" fill="url(#pipeTexture)" rx="4"/>

  <!-- 顶部蒸汽高光 -->
  <rect x="2" y="2" width="216" height="8" fill="url(#steam)" rx="3"/>

  <!-- 边缘铆钉装饰 (四角 + 中间) -->
  <g fill="#5D4A2A" stroke="#3D2817" stroke-width="0.5">
    <circle cx="8" cy="8" r="2"/>
    <circle cx="212" cy="8" r="2"/>
    <circle cx="8" cy="40" r="2"/>
    <circle cx="212" cy="40" r="2"/>
  </g>
  <!-- 铆钉高光 -->
  <g fill="#E8C875" opacity="0.8">
    <circle cx="7.5" cy="7.5" r="0.6"/>
    <circle cx="211.5" cy="7.5" r="0.6"/>
    <circle cx="7.5" cy="39.5" r="0.6"/>
    <circle cx="211.5" cy="39.5" r="0.6"/>
  </g>

  <!-- 齿轮 (左侧, 蒸汽朋克核心元素) -->
  <g transform="translate(26, 24)">
    <!-- 8 齿齿轮: 外径 12, 齿高 3 -->
    <g fill="url(#brassDark)" stroke="#3D2817" stroke-width="0.8">
      <!-- 齿轮主体 (8 齿, 用 path 绘制) -->
      <path d="M -3,-12 L 3,-12 L 3,-9 L -3,-9 Z
               M -3,9 L 3,9 L 3,12 L -3,12 Z
               M -12,-3 L -9,-3 L -9,3 L -12,3 Z
               M 9,-3 L 12,-3 L 12,3 L 9,3 Z"
            fill="url(#brassDark)" stroke="#3D2817" stroke-width="0.8"/>
      <g transform="rotate(45)">
        <path d="M -3,-12 L 3,-12 L 3,-9 L -3,-9 Z
                 M -3,9 L 3,9 L 3,12 L -3,12 Z
                 M -12,-3 L -9,-3 L -9,3 L -12,3 Z
                 M 9,-3 L 12,-3 L 12,3 L 9,3 Z"
              fill="url(#brassDark)" stroke="#3D2817" stroke-width="0.8"/>
      </g>
    </g>
    <!-- 齿轮圆盘 -->
    <circle r="9" fill="url(#brass)" stroke="#3D2817" stroke-width="1.2"/>
    <!-- 齿轮内圈装饰 -->
    <circle r="6" fill="none" stroke="#5D4A2A" stroke-width="0.8"/>
    <!-- 齿轮辐条 (4 条, 工业感) -->
    <g fill="#5D4A2A" stroke="#3D2817" stroke-width="0.5">
      <rect x="-0.8" y="-6" width="1.6" height="12" rx="0.3"/>
      <rect x="-6" y="-0.8" width="12" height="1.6" rx="0.3"/>
    </g>
    <!-- 中心轴承 -->
    <circle r="2.5" fill="url(#brassDark)" stroke="#3D2817" stroke-width="0.8"/>
    <circle r="1.2" fill="#1A0F08"/>
    <!-- 中心高光 -->
    <circle r="0.5" fill="#E8C875" cx="-0.4" cy="-0.4"/>
  </g>

  <!-- 流水线管道连接 (齿轮到文字) -->
  <g stroke="#5D4A2A" stroke-width="1.5" fill="none">
    <line x1="40" y1="24" x2="48" y2="24"/>
    <circle cx="44" cy="24" r="1" fill="#3D2817"/>
  </g>

  <!-- 主文字: FACTOR PIPELINE -->
  <text x="52" y="22" font-family="Georgia, 'Times New Roman', serif"
        font-size="14" font-weight="bold" fill="#3D2817" letter-spacing="0.5">
    FACTOR PIPELINE
  </text>

  <!-- 副文字: Quant Research OS -->
  <text x="52" y="35" font-family="Georgia, 'Times New Roman', serif"
        font-size="8.5" fill="#5D4A2A" font-style="italic" letter-spacing="0.3">
    Quant Research Operating System
  </text>

  <!-- 右侧: 版本号铆钉框 (压力表风格) -->
  <g>
    <!-- 框背景 -->
    <rect x="158" y="10" width="48" height="28" fill="#3D2817" stroke="#5D4A2A" stroke-width="1" rx="3"/>
    <!-- 框内黄铜 -->
    <rect x="160" y="12" width="44" height="24" fill="url(#brassDark)" rx="2"/>
    <!-- 铆钉 -->
    <circle cx="162" cy="14" r="0.8" fill="#1A0F08"/>
    <circle cx="202" cy="14" r="0.8" fill="#1A0F08"/>
    <circle cx="162" cy="34" r="0.8" fill="#1A0F08"/>
    <circle cx="202" cy="34" r="0.8" fill="#1A0F08"/>
    <!-- 版本号 -->
    <text x="182" y="27" font-family="'Courier New', monospace"
          font-size="11" font-weight="bold" fill="#E8C875"
          text-anchor="middle">v2.4.0</text>
  </g>

  <!-- 底部管道连接线 (流水线呼应) -->
  <g stroke="#5D4A2A" stroke-width="0.6" fill="none" opacity="0.7">
    <line x1="12" y1="44" x2="208" y2="44"/>
    <circle cx="30" cy="44" r="0.8" fill="#3D2817" stroke="none"/>
    <circle cx="60" cy="44" r="0.8" fill="#3D2817" stroke="none"/>
    <circle cx="90" cy="44" r="0.8" fill="#3D2817" stroke="none"/>
    <circle cx="120" cy="44" r="0.8" fill="#3D2817" stroke="none"/>
    <circle cx="150" cy="44" r="0.8" fill="#3D2817" stroke="none"/>
    <circle cx="180" cy="44" r="0.8" fill="#3D2817" stroke="none"/>
  </g>
</svg>
