<svg width="270" height="48" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 48" role="img" aria-label="Factor Pipeline v3.5.1 — Stable">
  <title>Factor Pipeline v3.5.1 — Stable</title>

  <!-- 终端底色: 纯黑 + 细边框, 无渐变无阴影 -->
  <rect width="270" height="48" fill="#000000"/>
  <rect x="0.5" y="0.5" width="269" height="47" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- 左侧琥珀色标识条 (Bloomberg 终端主色) -->
  <rect x="0" y="0" width="3" height="48" fill="#F5A623"/>

  <!-- 主标题: 等宽大写, 收敛字距 -->
  <text x="20" y="22"
        font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.6">FACTOR PIPELINE</text>

  <!-- 副标题: 低对比灰, 仅说明定位 -->
  <text x="20" y="36"
        font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="7" fill="#7A7A7A" letter-spacing="0.9">QUANT RESEARCH INFRASTRUCTURE</text>

  <!-- 右侧版本区: 细分隔线 + 琥珀色版本号 + 灰色状态 -->
  <line x1="214.5" y1="12" x2="214.5" y2="36" stroke="#2A2A2A" stroke-width="1"/>
  <text x="256" y="22" text-anchor="end"
        font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="10" font-weight="700" fill="#F5A623" letter-spacing="0.8">v3.5.1</text>
  <text x="256" y="35" text-anchor="end"
        font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="7" fill="#8A8A8A" letter-spacing="1">STABLE</text>
</svg>
