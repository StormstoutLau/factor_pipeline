# tox.ini — 本地跨版本测试配置 (ADR-017)
#
# 用法:
#   pip install tox
#   tox -l            # 列出所有环境
#   tox -e py311      # 只跑 Python 3.11
#   tox -e py312      # 只跑 Python 3.12
#   tox               # 跑所有环境
#
# 前提:
#   - 系统已安装对应 Python 版本 (3.10/3.11/3.12) 且在 PATH 中
#   - 外部模块已 pip install -e . 到对应 Python 的 site-packages
#     (tox 会创建隔离 venv, 外部模块需在每个 env 重新安装)
#
# 外部模块处理:
#   tox 创建隔离 venv, 不会继承主环境的外部模块.
#   使用 sitepackages = True 让 tox venv 继承系统 site-packages,
#   但这会污染隔离性. 替代方案: 用 deps 显式安装外部模块.
#
# 折中方案 (当前采用):
#   sitepackages = False + deps 安装外部模块 (从本地路径 -e ../Factor_DB)
#   慢但正确, 每个 env 独立安装所有依赖.
#
# 注意:
#   - 从父目录 (F:\Coding) 运行 tox, 避免 types.py 遮蔽 stdlib (ADR-016)
#   - tox.ini 放在 factor_pipeline/ 下, tox 会自动发现
#   - configfile 是 pyproject.toml [build-system] (isolated_build = True)

[tox]
envlist = py310, py311, py312
isolated_build = True
skip_missing_interpreters = True  # 系统没有的 Python 版本自动跳过

[testenv]
description = Run factor_pipeline test suite under {basepython}
# 不继承系统 site-packages, 每个 env 独立安装
sitepackages = False
# 允许 pip 安装外部 editable 包 (从本地路径)
allowlist_externals = pip

# 依赖安装顺序:
# 1. 外部模块 (从父目录本地路径 editable 安装)
# 2. 主项目 (从当前目录 editable 安装, 含 [dev] extras)
# 3. pytest (通过 [dev] extras 自动安装)
deps =
    -e {toxinidir}/../Factor_DB
    -e {toxinidir}/../Factor_Fingerprint
    -e {toxinidir}/../Factor_Decoupler
    -e {toxinidir}/../Factor_AdaptiveWinsor
    -e {toxinidir}/../Factor_Imputer_v2.0
    -e {toxinidir}/../Factor_Neutralizer_v2.0
    -e {toxinidir}/../Factor_Trading_v3.0
    -e {toxinidir}[dev]

# 测试命令: 从父目录运行 pytest 避免 types.py 遮蔽 stdlib
changedir = {toxinidir}/..
commands =
    python -m pytest factor_pipeline/tests/ {posargs:--tb=short -q --no-header}

[testenv:py310]
description = Test under Python 3.10

[testenv:py311]
description = Test under Python 3.11 (primary dev env)

[testenv:py312]
description = Test under Python 3.12

# 快速 lint 环境 (只检查语法, 不跑测试)
[testenv:lint]
description = Lint YAML and Python syntax
deps =
    pyyaml
commands =
    python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('ci.yml syntax OK')"
    python -m py_compile factor_pipeline/adapters.py
    python -m py_compile factor_pipeline/backtest/data_bridge.py
    python -m py_compile factor_pipeline/pipelines_v2.py
    python -c "print('Lint passed')"

# 覆盖率环境
[testenv:coverage]
description = Run tests with coverage report
deps =
    -e {toxinidir}/../Factor_DB
    -e {toxinidir}/../Factor_Fingerprint
    -e {toxinidir}/../Factor_Decoupler
    -e {toxinidir}/../Factor_AdaptiveWinsor
    -e {toxinidir}/../Factor_Imputer_v2.0
    -e {toxinidir}/../Factor_Neutralizer_v2.0
    -e {toxinidir}/../Factor_Trading_v3.0
    -e {toxinidir}[all]
commands =
    python -m pytest factor_pipeline/tests/ --cov=factor_pipeline --cov-report=term-missing --cov-report=html {posargs}
